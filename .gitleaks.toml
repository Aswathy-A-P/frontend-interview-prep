[extend]
useDefault = true

[allowlist]
description = "Repo-wide false-positive allowlist."
paths = [
  '''\.env\.(example|sample|template)$''',
  '''^\.gitleaks\.toml$''',
  '''^\.claude/hooks/block-secrets\.cjs$''',
  # Project-specific
  # Third-party dependencies and build output are not ours to scan.
  '''(^|[\\/])node_modules[\\/]''',
  '''(^|[\\/])dist[\\/]''',
  # Generated SHA-256 digests of the harness files, never secrets.
  '''^\.claude/harness/hashes\.json$''',
]
